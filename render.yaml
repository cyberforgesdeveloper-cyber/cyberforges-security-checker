services:
  - type: web
    name: cyberforges-backend
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r Backend/requirements.txt
    startCommand: cd Backend && python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 10000
        sync: false