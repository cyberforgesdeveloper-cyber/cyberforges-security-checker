services:
  - type: web
    name: cyberforges-backend
    env: python
    region: frankfurt
    plan: free
    rootDir: Backend
    buildCommand: pip install fastapi uvicorn reportlab sqlalchemy requests dnspython
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 10000